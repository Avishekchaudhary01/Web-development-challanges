
<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenge 1 - Smart Price Finder</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="container">
  <div class="top"><div><h1>Smart Price Finder</h1><p>Find products closest to your target price using binary search.</p></div><span class="badge">Challenge 01</span></div>
  <section class="panel"><div class="controls">
    <div class="field"><label for="targetPrice">Target Price</label><input id="targetPrice" type="number" min="0" placeholder="e.g. 70000"></div>
    <button id="searchBtn">Search</button>
  </div><p id="message">Enter a target price to search.</p></section>
  <section class="panel"><div class="top"><h2>Closest Products</h2><span><b id="resultCount">0</b> results</span></div><div id="results" class="grid"></div></section>
</main><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
